[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oibc-models-portable"
version = "0.1.0"
description = "Local-data solar forecasting with time-safe validation and portable model recipes"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "pyarrow>=18,<30", "lightgbm>=4.5,<5", "catboost>=1.2.7,<2", "psutil>=6,<8", "threadpoolctl>=3.5,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
neural = ["torch>=2.4,<3"]

[project.scripts]
oibc = "oibc_portable.cli:main"

[tool.setuptools.packages.find]
include = ["oibc_portable*"]
